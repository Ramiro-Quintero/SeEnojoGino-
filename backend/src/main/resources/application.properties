spring.application.name=backend

# Base de datos (Neon / PostgreSQL).
# Definir DB_URL, DB_USERNAME y DB_PASSWORD como variables de entorno
# (o en la configuracion de ejecucion de IntelliJ).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo maneja Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
